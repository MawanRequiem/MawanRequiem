<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Deep navy night sky with 4-pointed twinkling stars, a big yellow star, and shooting stars">
  <defs>
    <!-- Deep navy → indigo night sky gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0a2b" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Soft nebula glows -->
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c5fd5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4c5fd5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c6cf0" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7c6cf0" stop-opacity="0" />
    </radialGradient>

    <!-- Golden glow for the big yellow star -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#fde047" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0" />
    </radialGradient>

    <!-- Shooting star tails: transparent tip → bright head -->
    <linearGradient id="tailFade1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="tailFade2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0" />
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Unit 4-point sparkle (diamond), centered at 0,0 -->
    <path id="spark4" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" />
    <!-- 4-point sparkle with thin cross rays (the classic "star" glyph) -->
    <path id="spark4Cross" d="M0 -10 L1.6 -3 L10 0 L1.6 3 L0 10 L-1.6 3 L-10 0 L-1.6 -3 Z" />

    <!-- Soft halo for glowing stars -->
    <filter id="halo" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="haloStrong" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* ---- Twinkle keyframes (eased, with subtle scale pulse) ---- */
      @keyframes twinkleFar {
        0%, 100% { opacity: 0.12; transform: scale(0.92); }
        50%      { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes twinkleMid {
        0%, 100% { opacity: 0.2; transform: scale(0.94); }
        50%      { opacity: 1;   transform: scale(1.1); }
      }
      @keyframes twinkleNear {
        0%, 100% { opacity: 0.35; transform: scale(0.95); }
        50%      { opacity: 1;    transform: scale(1.15); }
      }

      /* ---- Slow drift for the whole starfield (parallax feel) ---- */
      @keyframes drift {
        0%, 100% { transform: translate(0, 0); }
        50%      { transform: translate(12px, 6px); }
      }

      /* ---- Pulsing golden halo for the big star ---- */
      @keyframes goldPulse {
        0%, 100% { opacity: 0.5; transform: scale(0.92); }
        50%      { opacity: 1;   transform: scale(1.08); }
      }

      /* ---- Big yellow star: gentle rotation + subtle scale breathe ---- */
      @keyframes goldStarSpin {
        0%, 100% { transform: rotate(0deg) scale(1); }
        50%      { transform: rotate(8deg) scale(1.06); }
      }

      /* ---- Shooting star #1: fast, top-left → mid-right ---- */
      @keyframes shoot1 {
        0%   { transform: translate(-160px, -90px) rotate(-30deg); opacity: 0; }
        2%   { opacity: 1; }
        7%   { transform: translate(340px, 30px)  rotate(-32deg); opacity: 1; }
        10%  { transform: translate(560px, 150px) rotate(-34deg); opacity: 0; }
        100% { transform: translate(560px, 150px) rotate(-34deg); opacity: 0; }
      }

      /* ---- Shooting star #2: slow, lower-left → far right (indigo tail) ---- */
      @keyframes shoot2 {
        0%   { transform: translate(-200px, 60px)  rotate(-22deg); opacity: 0; }
        4%   { opacity: 0.9; }
        20%  { transform: translate(300px, 150px) rotate(-24deg); opacity: 0.9; }
        27%  { transform: translate(700px, 260px) rotate(-26deg); opacity: 0; }
        100% { transform: translate(700px, 260px) rotate(-26deg); opacity: 0; }
      }

      /* ---- Shooting star #3: mid-fast, mid-right → bottom-left (steep) ---- */
      @keyframes shoot3 {
        0%   { transform: translate(650px, -140px) rotate(24deg); opacity: 0; }
        3%   { opacity: 0.85; }
        12%  { transform: translate(460px, 80px)   rotate(26deg); opacity: 0.85; }
        16%  { transform: translate(330px, 240px)  rotate(28deg); opacity: 0; }
        100% { transform: translate(330px, 240px)  rotate(28deg); opacity: 0; }
      }

      /* ---- Staggered, desynced application (negative delays) ---- */
      .sFar  { animation: twinkleFar 7s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
      .sMid  { animation: twinkleMid 4.5s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
      .sNear { animation: twinkleNear 2.8s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
      .d1    { animation-delay: -1.2s; }
      .d2    { animation-delay: -2.6s; }
      .d3    { animation-delay: -3.9s; }
      .d4    { animation-delay: -5.1s; }

      .drift { animation: drift 26s infinite ease-in-out; }

      .goldStarHalo {
        animation: goldPulse 3.4s infinite ease-in-out;
        transform-box: fill-box;
        transform-origin: center;
      }
      .goldStarBody {
        animation: goldStarSpin 5.2s infinite ease-in-out;
        transform-box: fill-box;
        transform-origin: center;
      }

      /* Three shooting stars, all desynced with distinct timings */
      .shootingStar1 { animation: shoot1 11s cubic-bezier(0.45, 0, 0.55, 1) infinite; transform-box: fill-box; transform-origin: center; }
      .shootingStar2 { animation: shoot2 17s cubic-bezier(0.45, 0, 0.55, 1) infinite; transform-box: fill-box; transform-origin: center; }
      .shootingStar3 { animation: shoot3 14s cubic-bezier(0.45, 0, 0.55, 1) infinite; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="900" height="300" fill="url(#nightSky)" />
  <circle cx="140" cy="55" r="200" fill="url(#nebula1)" />
  <circle cx="720" cy="230" r="230" fill="url(#nebula2)" />

  <!-- ===== FAR layer: tiny, slow, sparse (depth) ===== -->
  <g fill="#c7d2fe" class="drift">
    <circle class="sFar d1" cx="40" cy="45" r="1.0" />
    <circle class="sFar d2" cx="120" cy="180" r="0.9" />
    <circle class="sFar d3" cx="215" cy="100" r="1.1" />
    <circle class="sFar d4" cx="300" cy="40" r="0.9" />
    <circle class="sFar d2" cx="385" cy="160" r="1.0" />
    <circle class="sFar d1" cx="470" cy="70" r="0.9" />
    <circle class="sFar d3" cx="560" cy="190" r="1.1" />
    <circle class="sFar d4" cx="645" cy="120" r="0.9" />
    <circle class="sFar d1" cx="760" cy="50" r="1.0" />
    <circle class="sFar d2" cx="830" cy="150" r="0.9" />
    <circle class="sFar d3" cx="90" cy="240" r="0.9" />
    <circle class="sFar d4" cx="500" cy="245" r="0.9" />
    <circle class="sFar d1" cx="700" cy="260" r="1.0" />
    <circle class="sFar d2" cx="250" cy="235" r="0.9" />
    <circle class="sFar d3" cx="875" cy="255" r="0.9" />
    <circle class="sFar d4" cx="55" cy="130" r="0.9" />
    <circle class="sFar d1" cx="420" cy="210" r="1.1" />
    <circle class="sFar d2" cx="810" cy="90" r="0.9" />
  </g>

  <!-- ===== MID layer: 4-pointed white stars with twinkle + scale ===== -->
  <g fill="#ffffff">
    <use href="#spark4" class="sMid d2" transform="translate(95, 70) scale(1.1)" />
    <use href="#spark4" class="sMid d4" transform="translate(180, 200) scale(0.9)" />
    <use href="#spark4Cross" class="sMid d1" transform="translate(265, 130) scale(1.3)" />
    <use href="#spark4" class="sMid d3" transform="translate(340, 40) scale(0.8)" />
    <use href="#spark4" class="sMid d2" transform="translate(430, 170) scale(1.2)" />
    <use href="#spark4Cross" class="sMid d4" transform="translate(520, 90) scale(0.9)" />
    <use href="#spark4" class="sMid d1" transform="translate(600, 220) scale(1.1)" />
    <use href="#spark4Cross" class="sMid d3" transform="translate(680, 140) scale(1.4)" />
    <use href="#spark4" class="sMid d2" transform="translate(790, 60) scale(1)" />
    <use href="#spark4" class="sMid d4" transform="translate(855, 185) scale(0.8)" />
  </g>

  <!-- ===== NEAR layer: bright, fast, glowing 4-point accents ===== -->
  <g fill="#ffffff" filter="url(#halo)">
    <use href="#spark4Cross" class="sNear d3" transform="translate(60, 190) scale(1.5)" />
    <use href="#spark4Cross" class="sNear d1" transform="translate(320, 250) scale(1.3)" />
    <use href="#spark4" class="sNear d4" transform="translate(745, 250) scale(1.6)" />
    <use href="#spark4Cross" class="sNear d2" transform="translate(610, 30) scale(1.4)" />
  </g>

  <!-- ===== Shooting stars (varied angles, speeds, timings) ===== -->
  <!-- #1: fast, white tail, top-left → mid-right -->
  <g class="shootingStar1">
    <circle cx="0" cy="0" r="2.4" fill="#ffffff" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" opacity="0.35" />
    <path d="M0 -1 L-95 -10 L0 1 L0 -1 Z" fill="url(#tailFade1)" />
  </g>
  <!-- #2: slow, indigo tail, lower-left → far right -->
  <g class="shootingStar2">
    <circle cx="0" cy="0" r="2" fill="#e0e7ff" />
    <circle cx="0" cy="0" r="5" fill="#e0e7ff" opacity="0.3" />
    <path d="M0 -1 L-130 -12 L0 1 L0 -1 Z" fill="url(#tailFade2)" />
  </g>
  <!-- #3: mid-fast, white tail, top-right → bottom-left (steep) -->
  <g class="shootingStar3">
    <circle cx="0" cy="0" r="2.1" fill="#ffffff" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" opacity="0.3" />
    <path d="M0 -1 L-70 -8 L0 1 L0 -1 Z" fill="url(#tailFade1)" />
  </g>

  <!-- ===== Big yellow 4-point star with pulsing golden halo ===== -->
  <g transform="translate(790, 250)">
    <circle cx="0" cy="0" r="50" fill="url(#goldGlow)" class="goldStarHalo" />
    <g filter="url(#haloStrong)" class="goldStarBody">
      <use href="#spark4Cross" fill="#fde047" transform="scale(3.6)" />
    </g>
  </g>

  <!-- ===== Name banner ===== -->
  <text x="450" y="162" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="44" font-weight="bold" fill="#e0e7ff" letter-spacing="2">Dharmawan Surya Kusuma</text>
  <text x="450" y="204" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a5b4fc" letter-spacing="4">FULL-STACK DEVELOPER &amp; CLOUD ENTHUSIAST</text>

  <!-- ===== Horizon mountains ===== -->
  <path d="M0 260 Q120 220 260 255 T540 240 T900 260 L900 300 L0 300 Z" fill="#0b0a26" opacity="0.85" />
  <path d="M0 280 Q180 248 380 272 T760 264 T900 280 L900 300 L0 300 Z" fill="#050414" opacity="0.95" />
</svg>
