<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Indigo night sky with twinkling stars and a shooting star">
  <defs>
    <!-- Indigo night sky gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0a2b" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Soft nebula glows -->
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>

    <!-- Golden glow for the big yellow star -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#fde047" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0" />
    </radialGradient>

    <!-- Shooting star tail -->
    <linearGradient id="tailFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Star shape (unit 5-point star, centered at 0,0) -->
    <path id="star" d="M0 -7.5 L1.8 -2.3 L7.3 -2.3 L2.7 0.9 L4.5 6 L0 2.9 L-4.5 6 L-2.7 0.9 L-7.3 -2.3 L-1.8 -2.3 Z" />

    <!-- Soft halo for glowing stars -->
    <filter id="halo" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="haloStrong" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* Gentle twinkle for white stars */
      @keyframes twinkleA {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      @keyframes twinkleB {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.95; }
      }
      @keyframes twinkleC {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.8; }
      }

      /* Pulsing golden halo for the big star */
      @keyframes goldPulse {
        0%, 100% { opacity: 0.45; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }

      /* Shooting star sweep */
      @keyframes shoot {
        0%   { transform: translate(-80px, -60px); opacity: 0; }
        4%   { opacity: 1; }
        12%  { transform: translate(560px, 90px); opacity: 1; }
        16%  { transform: translate(680px, 130px); opacity: 0; }
        100% { transform: translate(680px, 130px); opacity: 0; }
      }

      .tA { animation: twinkleA 3s infinite ease-in-out; }
      .tB { animation: twinkleB 4.5s infinite ease-in-out; }
      .tC { animation: twinkleC 6s infinite ease-in-out; }

      .shootingStar {
        animation: shoot 9s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .goldStarHalo {
        animation: goldPulse 3.2s infinite ease-in-out;
        transform-box: fill-box;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="900" height="280" fill="url(#nightSky)" />
  <circle cx="150" cy="60" r="190" fill="url(#nebula1)" />
  <circle cx="720" cy="220" r="220" fill="url(#nebula2)" />

  <!-- Distant faint dust stars -->
  <g fill="#c7d2fe" opacity="0.5">
    <circle cx="40" cy="45" r="1.1" /><circle cx="120" cy="180" r="1" /><circle cx="215" cy="100" r="1.2" />
    <circle cx="300" cy="40" r="1" /><circle cx="385" cy="160" r="1.1" /><circle cx="470" cy="70" r="1" />
    <circle cx="560" cy="190" r="1.2" /><circle cx="645" cy="120" r="1" /><circle cx="760" cy="50" r="1.1" />
    <circle cx="830" cy="150" r="1" /><circle cx="90" cy="240" r="1" /><circle cx="500" cy="245" r="1" />
    <circle cx="700" cy="260" r="1.1" /><circle cx="250" cy="235" r="1" /><circle cx="875" cy="255" r="1" />
    <circle cx="55" cy="130" r="1" /><circle cx="420" cy="210" r="1.2" /><circle cx="810" cy="90" r="1" />
  </g>

  <!-- White twinkling stars -->
  <g fill="#ffffff">
    <use href="#star" class="tA" transform="translate(95, 70) scale(1.1)" />
    <use href="#star" class="tB" transform="translate(180, 200) scale(0.9)" />
    <use href="#star" class="tC" transform="translate(265, 130) scale(1.3)" />
    <use href="#star" class="tB" transform="translate(340, 40) scale(0.8)" />
    <use href="#star" class="tA" transform="translate(430, 170) scale(1.2)" />
    <use href="#star" class="tC" transform="translate(520, 90) scale(0.9)" />
    <use href="#star" class="tA" transform="translate(600, 220) scale(1.1)" />
    <use href="#star" class="tB" transform="translate(680, 140) scale(1.4)" />
    <use href="#star" class="tC" transform="translate(790, 60) scale(1)" />
    <use href="#star" class="tA" transform="translate(855, 185) scale(0.8)" />
  </g>

  <!-- Glowing accent stars -->
  <g filter="url(#halo)">
    <use href="#star" class="tB" transform="translate(60, 190) scale(1.5)" />
    <use href="#star" class="tA" transform="translate(320, 250) scale(1.3)" />
    <use href="#star" class="tC" transform="translate(745, 250) scale(1.6)" />
    <use href="#star" class="tB" transform="translate(610, 30) scale(1.4)" />
  </g>

  <!-- Shooting star -->
  <g class="shootingStar">
    <circle cx="0" cy="0" r="2.4" fill="#ffffff" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" opacity="0.35" />
    <path d="M0 -1 L-95 -10 L0 1 L0 -1 Z" fill="url(#tailFade)" />
  </g>

  <!-- Big yellow star with pulsing golden halo -->
  <g transform="translate(780, 245)">
    <circle cx="0" cy="0" r="46" fill="url(#goldGlow)" class="goldStarHalo" />
    <g filter="url(#haloStrong)">
      <use href="#star" fill="#fde047" transform="scale(3.4)" />
    </g>
  </g>

  <!-- Name banner -->
  <text x="450" y="158" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="44" font-weight="bold" fill="#e0e7ff" letter-spacing="2">Dharmawan Surya Kusuma</text>
  <text x="450" y="200" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a5b4fc" letter-spacing="4">FULL-STACK DEVELOPER &amp; CLOUD ENTHUSIAST</text>

  <!-- Horizon mountains -->
  <path d="M0 250 Q120 215 260 245 T540 235 T900 250 L900 280 L0 280 Z" fill="#0b0a26" opacity="0.85" />
  <path d="M0 268 Q180 240 380 262 T760 255 T900 268 L900 280 L0 280 Z" fill="#050414" opacity="0.95" />
</svg>
